services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: finance_api

    ports:
      - "8006:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: always


  postgres:
    image: postgres:15
    container_name: finance_postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

    restart: always


  backup:
    image: postgres:15
    container_name: finance_backup

    user: "1000:1000"

    depends_on:
      - postgres

    volumes:
      - ./backups:/backups:Z

    env_file:
      - .env

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    entrypoint: >
      bash -c "
      while true; do
        echo '📦 Running backup...';
        pg_dump -h postgres -U ${POSTGRES_USER} ${POSTGRES_DB} > /backups/backup_$$(date +%F_%H-%M-%S).sql;
        sleep 3600;
      done
      "

    restart: always


volumes:
  postgres_data:
    name: finance_postgres_data